<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Title & Header (High Contrast White) -->
  <rect x="0" y="0" width="650" height="95" fill="#0b1120" />
  <text x="50" y="48" font-size="24" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="0.5">Cleveria — Enterprise Agent Fleet Architecture</text>
  <text x="50" y="74" font-size="14" font-weight="normal" fill="#94a3b8" stroke="none">Cryptographic Authority Boundary &amp; Scoped Execution on Google Cloud</text>

  <!-- Subsystem Tags / Capabilities Legend -->
  <g transform="translate(680, 26)">
    <rect x="0" y="0" width="470" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="30" font-size="11" font-weight="bold" fill="#f1f5f9">FLEET CAPABILITIES:</text>
    <rect x="145" y="15" width="65" height="22" rx="4" fill="#0284c7" />
    <text x="155" y="30" font-size="11" font-weight="bold" fill="#ffffff">Registry</text>
    <rect x="218" y="15" width="65" height="22" rx="4" fill="#16a34a" />
    <text x="228" y="30" font-size="11" font-weight="bold" fill="#ffffff">Identity</text>
    <rect x="290" y="15" width="65" height="22" rx="4" fill="#d97706" />
    <text x="298" y="30" font-size="11" font-weight="bold" fill="#ffffff">Gateway</text>
    <rect x="362" y="15" width="95" height="22" rx="4" fill="#7c3aed" />
    <text x="368" y="30" font-size="11" font-weight="bold" fill="#ffffff">Durable State</text>
  </g>

  <!-- SECTION: TRIGGER & REGISTRY -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="230" height="520" rx="12" fill="#151e2e" stroke="#334155" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="15" font-weight="bold" fill="#38bdf8">1. TRIGGER &amp; REGISTRY</text>
    
    <!-- Cloud Scheduler -->
    <rect x="15" y="55" width="200" height="85" rx="8" fill="#0b1120" stroke="#0284c7" stroke-width="1.5"/>
    <text x="25" y="80" font-size="13" font-weight="bold" fill="#ffffff">Cloud Scheduler</text>
    <text x="25" y="100" font-size="11" fill="#94a3b8">Wakes every 15 min</text>
    <text x="25" y="122" font-size="10" font-weight="bold" fill="#38bdf8">OIDC: sa-temporizador</text>

    <!-- Agent Catalog / Cards -->
    <rect x="15" y="155" width="200" height="155" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="25" y="165" width="115" height="20" rx="4" fill="#0284c7"/>
    <text x="30" y="179" font-size="9" font-weight="bold" fill="#ffffff">FLEET: REGISTRY</text>
    <text x="25" y="205" font-size="13" font-weight="bold" fill="#ffffff">Agent Cards Catalog</text>
    <text x="25" y="225" font-size="11" fill="#cbd5e1">• agente-curador (MAQ)</text>
    <text x="25" y="243" font-size="11" fill="#cbd5e1">• agente-comercial (MAQ)</text>
    <text x="25" y="261" font-size="11" fill="#cbd5e1">• persona-operador (HUM)</text>
    <text x="25" y="290" font-size="10" fill="#64748b">Generated from directory.json</text>

    <!-- Multimodal Ingestion -->
    <rect x="15" y="325" width="200" height="105" rx="8" fill="#0b1120" stroke="#475569"/>
    <text x="25" y="350" font-size="13" font-weight="bold" fill="#ffffff">Voice / Text Channels</text>
    <text x="25" y="370" font-size="11" fill="#94a3b8">Transducers (STT/TTS)</text>
    <text x="25" y="392" font-size="10" fill="#e2e8f0">Speech transformed to data</text>
    <text x="25" y="412" font-size="10" font-weight="bold" fill="#ef4444">Cannot bypass safety fences</text>
  </g>

  <!-- Flow arrow from Scheduler to Execution -->
  <path d="M 280 185 L 330 185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SECTION: ADK RUNTIME & DUAL-MODEL SAFETY -->
  <g transform="translate(330, 105)">
    <rect x="0" y="0" width="370" height="520" rx="12" fill="#151e2e" stroke="#334155" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="15" font-weight="bold" fill="#38bdf8">2. ADK WORKFLOW &amp; SAFETY</text>

    <!-- Authority Ceiling & Semantic Fence -->
    <rect x="15" y="55" width="340" height="115" rx="8" fill="#0b1120" stroke="#d97706" stroke-width="1.5"/>
    <rect x="25" y="65" width="180" height="20" rx="4" fill="#d97706"/>
    <text x="30" y="79" font-size="9" font-weight="bold" fill="#ffffff">INJECTION DEFENSE / GATEWAY</text>
    <text x="25" y="105" font-size="13" font-weight="bold" fill="#fbbf24">Deterministic Authority Ceiling</text>
    <text x="25" y="125" font-size="11" fill="#cbd5e1">+ Semantic Fence (<tspan fill="#38bdf8" font-weight="bold">gemini-embedding-001</tspan>)</text>
    <text x="25" y="152" font-size="10" font-weight="bold" fill="#f87171">Rule: Can ONLY demand caution (exige_humano), never widen authority.</text>

    <!-- Gemini Adjudication -->
    <rect x="15" y="185" width="340" height="100" rx="8" fill="#0b1120" stroke="#0284c7" stroke-width="1.5"/>
    <text x="25" y="210" font-size="13" font-weight="bold" fill="#38bdf8">Gemini 3.6 Flash Adjudication</text>
    <text x="25" y="232" font-size="11" font-weight="bold" fill="#ffffff">The ONLY deciding model in the workflow.</text>
    <text x="25" y="252" font-size="11" fill="#cbd5e1">Evaluates evidence &amp; proposes task state.</text>
    <text x="25" y="272" font-size="10" fill="#94a3b8">Bound by router taking MIN(model, ceiling)</text>

    <!-- Routing Engine -->
    <rect x="15" y="300" width="340" height="150" rx="8" fill="#0b1120" stroke="#334155"/>
    <text x="25" y="325" font-size="13" font-weight="bold" fill="#ffffff">Deterministic Router (6 Pure Functions)</text>
    <path d="M 25 338 L 335 338" stroke="#334155" stroke-width="1"/>
    
    <text x="25" y="360" font-size="11" font-weight="bold" fill="#4ade80">• Closed (Verifiable Evidence) ➔ Machine Sign</text>
    <text x="25" y="385" font-size="11" font-weight="bold" fill="#fbbf24">• Exige Humano (Judgement/Risk) ➔ Pause Flow</text>
    <text x="25" y="410" font-size="11" font-weight="bold" fill="#94a3b8">• Open / Unsigned (No Evidence) ➔ Return</text>
    <text x="25" y="433" font-size="10" fill="#f87171">Dead branches route to safe fallback (Default Route)</text>
  </g>

  <!-- Flow arrows to Infrastructure -->
  <path d="M 700 185 L 750 185" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 700 435 L 750 435" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SECTION: GOOGLE CLOUD SECURITY & KMS -->
  <g transform="translate(750, 105)">
    <rect x="0" y="0" width="400" height="520" rx="12" fill="#151e2e" stroke="#334155" filter="url(#shadow)"/>
    <text x="20" y="35" font-size="15" font-weight="bold" fill="#38bdf8">3. GOOGLE CLOUD BOUNDARY &amp; AUDIT</text>

    <!-- Cloud KMS Cryptographic Separation -->
    <rect x="15" y="55" width="370" height="185" rx="8" fill="#0b1120" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="25" y="65" width="155" height="20" rx="4" fill="#16a34a"/>
    <text x="30" y="79" font-size="9" font-weight="bold" fill="#ffffff">FLEET: IDENTITY &amp; GATEWAY</text>
    
    <text x="25" y="105" font-size="13" font-weight="bold" fill="#ffffff">Cloud KMS Asymmetric Keys (P-256)</text>
    
    <!-- Machine Key Box -->
    <rect x="25" y="118" width="160" height="110" rx="6" fill="#1e293b" stroke="#0284c7"/>
    <text x="35" y="138" font-size="11" font-weight="bold" fill="#38bdf8">clave-agente (MAQ)</text>
    <text x="35" y="158" font-size="10" fill="#cbd5e1">Scope: [cerrada, abierta]</text>
    <text x="35" y="178" font-size="10" fill="#4ade80">IAM: sa-agente-curador</text>
    <text x="35" y="208" font-size="11" font-weight="bold" fill="#38bdf8">HTTP 200 OK</text>

    <!-- Human Key Box -->
    <rect x="195" y="118" width="180" height="110" rx="6" fill="#1e293b" stroke="#dc2626"/>
    <text x="205" y="138" font-size="11" font-weight="bold" fill="#f87171">clave-humano (HUM)</text>
    <text x="205" y="158" font-size="10" fill="#cbd5e1">Scope: [descartada, ...]</text>
    <text x="205" y="178" font-size="10" fill="#94a3b8">IAM: None (Person host)</text>
    <text x="205" y="208" font-size="11" font-weight="bold" fill="#ef4444">HTTP 403 DENIED</text>

    <!-- Durable State (Firestore) -->
    <rect x="15" y="255" width="370" height="110" rx="8" fill="#0b1120" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="25" y="265" width="155" height="20" rx="4" fill="#7c3aed"/>
    <text x="30" y="279" font-size="9" font-weight="bold" fill="#ffffff">FLEET: DURABLE STATE</text>
    <text x="25" y="305" font-size="13" font-weight="bold" fill="#c084fc">Cloud Firestore State Store</text>
    <text x="25" y="325" font-size="11" fill="#cbd5e1">• Persists workflow facts: requests, verdicts, signatures</text>
    <text x="25" y="348" font-size="10" font-weight="bold" fill="#a855f7">Durable recovery across process restarts (Kill-and-Resume)</text>

    <!-- Offline Verifier -->
    <rect x="15" y="380" width="370" height="120" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="405" font-size="13" font-weight="bold" fill="#38bdf8">RFC 8785 Offline Pure Verifier</text>
    <text x="25" y="425" font-size="11" fill="#cbd5e1">Zero network • Zero Google credentials • Standard library</text>
    <text x="25" y="445" font-size="10" fill="#94a3b8">Re-derive every signature independently anywhere.</text>
    <text x="25" y="475" font-size="11" font-weight="bold" fill="#4ade80">Independent Trust Anchor</text>
  </g>

  <!-- Footer Banner -->
  <rect x="50" y="635" width="1100" height="38" rx="6" fill="#151e2e" stroke="#334155"/>
  <text x="70" y="652" font-size="11" fill="#cbd5e1">Cloud Run validates OIDC tokens per caller (<tspan fill="#38bdf8">sa-temporizador</tspan> ➔ /despertar · <tspan fill="#4ade80">sa-agente-curador</tspan> ➔ Cloud KMS). Zero trust on client claims.</text>
  <text x="70" y="667" font-size="10" fill="#94a3b8">Stack: Cloud Run • Cloud KMS (EC P-256) • Cloud Firestore (atomic transactions) • Cloud Scheduler • Vertex AI • ADK 2.8</text>
</svg>
