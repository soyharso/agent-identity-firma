<svg width="300" height="92" viewBox="0 0 300 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qnowa">
  <!-- EL LOGOTIPO REAL, calcado del que sirve qnowa.com, leído el 2026-08-31.

       LO QUE HABÍA AQUÍ ERA UNA APROXIMACIÓN, y el error es de los que no se ven mirando el
       archivo: un tile con degradado azul→cian y una lupa blanca dentro, con el rótulo trazado a
       vector. Coherente, comentado, y con la paleta de las dos pantallas cuadrando con él. Todo
       consistente entre sí y nada verificado — nadie había abierto la página.

       LA MARCA ES VERDE (#0F6F66), el símbolo no lleva tile, y su acento es el punto ámbar del
       final del asta, seguido de otros dos que se apagan. Lleva bajada: «orquestación de
       atención». El aro es lo que se lee como un ojo. -->
  <circle cx="38" cy="38" r="22" fill="none" stroke="#0F6F66" stroke-width="11"/>
  <line x1="52" y1="54" x2="60" y2="74" stroke="#0F6F66" stroke-width="11" stroke-linecap="round"/>
  <circle cx="74" cy="78" r="5" fill="#D99A2B"/>
  <circle cx="90" cy="78" r="4" fill="#0F6F66" opacity=".55"/>
  <circle cx="104" cy="78" r="4" fill="#0F6F66" opacity=".3"/>
  <text x="122" y="53" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-1" fill="#16211E">qnowa</text>
  <text x="124" y="74" font-family="Inter, Segoe UI, system-ui, sans-serif"
        font-size="11.5" letter-spacing=".8" fill="#5F6B66">orquestación de atención</text>
</svg>
