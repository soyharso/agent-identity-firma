<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Decorative Grid -->
  <rect x="100" y="100" width="1720" height="880" rx="24" fill="url(#blueGlow)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header / Hackathon Badge -->
  <g transform="translate(180, 180)">
    <rect x="0" y="0" width="320" height="38" rx="8" fill="#0284c7"/>
    <text x="18" y="24" font-size="14" font-weight="bold" fill="#ffffff">ALL THINGS AGENTIC HACKATHON</text>
    <rect x="335" y="0" width="280" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="350" y="24" font-size="14" font-weight="bold" fill="#38bdf8">FORTIFIED ENTERPRISE FLEET</text>
  </g>

  <!-- Main Title -->
  <text x="180" y="320" font-size="64" font-weight="900" fill="#ffffff" filter="url(#dropShadow)">CLEVERIA</text>
  <text x="180" y="390" font-size="34" font-weight="700" fill="#38bdf8">Enterprise Agent Fleet Identity &amp; Authority Lock</text>

  <!-- Tagline / Value Proposition -->
  <rect x="180" y="440" width="1560" height="120" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="220" y="495" font-size="24" font-weight="bold" fill="#f8fafc">"Companies are about to run fleets of AI agents. When one acts, who authorized it?"</text>
  <text x="220" y="530" font-size="18" fill="#94a3b8">The machine resolves what it can prove. Human judgement is protected by Cloud KMS.</text>

  <!-- Key Metrics / Highlights (3 Cards) -->
  <g transform="translate(180, 600)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="490" height="240" rx="16" fill="#151e2e" stroke="#0284c7" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="30" y="50" font-size="20" font-weight="bold" fill="#38bdf8">1. The Real Defect</text>
    <text x="30" y="90" font-size="36" font-weight="900" fill="#ef4444">58 Machine Closures</text>
    <text x="30" y="130" font-size="16" fill="#cbd5e1">Signed as 'human' by default in preproduction.</text>
    <text x="30" y="160" font-size="16" fill="#94a3b8">4 cases absolved debts and dismissed claims.</text>
    <text x="30" y="200" font-size="14" font-weight="bold" fill="#4ade80">Solved at infrastructure level.</text>

    <!-- Card 2 -->
    <rect x="535" y="0" width="490" height="240" rx="16" fill="#151e2e" stroke="#16a34a" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="565" y="50" font-size="20" font-weight="bold" fill="#4ade80">2. True Cloud Boundary</text>
    <text x="565" y="90" font-size="36" font-weight="900" fill="#f8fafc">HTTP 403 Forbidden</text>
    <text x="565" y="130" font-size="16" fill="#cbd5e1">Google Cloud KMS denies machine key requests.</text>
    <text x="565" y="160" font-size="16" fill="#94a3b8">Human keys stay on operator workstation.</text>
    <text x="565" y="200" font-size="14" font-weight="bold" fill="#38bdf8">Deterministic arithmetic security.</text>

    <!-- Card 3 -->
    <rect x="1070" y="0" width="490" height="240" rx="16" fill="#151e2e" stroke="#7c3aed" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="1100" y="50" font-size="20" font-weight="bold" fill="#c084fc">3. Fleet Governance</text>
    <text x="1100" y="90" font-size="36" font-weight="900" fill="#f8fafc">Dual-Model Safety</text>
    <text x="1100" y="130" font-size="16" fill="#cbd5e1">Gemini 3.6 Flash + gemini-embedding-001.</text>
    <text x="1100" y="160" font-size="16" fill="#94a3b8">Deterministic router takes MIN(model, ceiling).</text>
    <text x="1100" y="200" font-size="14" font-weight="bold" fill="#fbbf24">Zero-Trust Agent-to-Agent.</text>
  </g>

  <!-- Footer -->
  <text x="180" y="920" font-size="16" font-weight="bold" fill="#64748b">Softronica S.A.S. • Startup Excellence Track • Google ADK 2.8 • Cloud Run • Cloud KMS • Firestore</text>
</svg>
