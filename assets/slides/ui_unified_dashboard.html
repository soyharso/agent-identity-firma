<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleveria — Unified Fleet Command</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #06111F; color: #E9FFFB; margin: 0; padding: 20px; }
        .header { margin-bottom: 20px; border-bottom: 1px solid #0B2940; padding-bottom: 10px; }
        .header h1 { color: #E9FFFB; margin: 0; font-size: 1.5rem; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #0B2940; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #27E6D2; font-size: 1.2rem; margin-top: 0; display: flex; justify-content: space-between; }
        .audit-row { background: #06111F; padding: 15px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #93A8B8; font-size: 0.9rem; }
        .audit-row.ok { border-left-color: #27E6D2; }
        .audit-row.denied { border-left-color: #FF6B6B; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; background: #4B6BFF; color: white; }
        .badge.human { background: #8D72FF; }
        .badge.fail { background: #FF6B6B; }
        .hash-str { font-family: monospace; color: #93A8B8; font-size: 0.8rem; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #151D33; }
        th { color: #93A8B8; }
        .btn { background: #4B6BFF; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #3b5bdb; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cleveria Identity — Liability Audit Ledger</h1>
        <p style="color: #93A8B8; font-size: 0.9rem; margin: 5px 0 0 0;">LIVE TELEMETRY FROM CLOUD KMS & OFFLINE VERIFIER</p>
    </div>

    <div style="margin-bottom: 20px;">
        <button class="btn" onclick="fetchData()">🔄 Sync Ledger Data</button>
    </div>

    <div class="dashboard">
        <!-- FIRMAS GRAFO -->
        <div class="panel">
            <h2>Cryptographic Ledger (firmas_grafo.jsonl) <span class="badge" id="ledger-count">0</span></h2>
            <div id="ledger-container">Loading...</div>
        </div>

        <!-- PRUEBAS DE RUPTURA -->
        <div class="panel">
            <h2>Integrity Verifier (pruebas_de_ruptura.json) <span class="badge human" id="test-date">...</span></h2>
            <table>
                <thead>
                    <tr>
                        <th>Test Case</th>
                        <th>Rompe</th>
                        <th>Verdict</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="tests-container">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchData() {
            document.getElementById('ledger-container').innerHTML = 'Syncing...';
            document.getElementById('tests-container').innerHTML = '<tr><td colspan="4">Syncing...</td></tr>';
            try {
                const res = await fetch('/api/auditoria_datos');
                const data = await res.json();
                
                // Render Ledger
                const ledgerEl = document.getElementById('ledger-container');
                ledgerEl.innerHTML = '';
                document.getElementById('ledger-count').textContent = data.firmas.length;
                
                data.firmas.reverse().forEach(f => {
                    const statusClass = f.veredicto === 'OK' ? 'ok' : 'denied';
                    const badgeClass = f.sobre && f.sobre.tipo_firmante === 'HUMANO' ? 'badge human' : 'badge';
                    const failClass = f.veredicto !== 'OK' ? 'badge fail' : '';
                    
                    const div = document.createElement('div');
                    div.className = `audit-row ${statusClass}`;
                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <strong>${f.peticion_id}</strong>
                            <span class="${failClass || badgeClass}">${f.veredicto}</span>
                        </div>
                        <div><strong>Propuesto por:</strong> ${f.sobre ? f.sobre.origen || 'sistema' : 'N/A'}</div>
                        <div><strong>Aprobado por:</strong> ${f.sobre ? f.sobre.curado_por || 'N/A' : 'N/A'}</div>
                        <div><strong>Veredicto Offline:</strong> ${f.veredicto} ${f.dictamen ? `(${f.dictamen})` : ''}</div>
                        ${f.sobre ? `<div class="hash-str" style="margin-top:5px;">Hash: ${f.sobre.hash_contenido}</div>` : ''}
                    `;
                    ledgerEl.appendChild(div);
                });

                // Render Tests
                const testsEl = document.getElementById('tests-container');
                testsEl.innerHTML = '';
                document.getElementById('test-date').textContent = data.pruebas_fecha;
                
                data.pruebas_tests.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${t.nombre}</td>
                        <td style="color:#93A8B8; font-size:0.8rem;">${t.rompe}</td>
                        <td style="color: ${t.ok ? '#27E6D2' : '#FF6B6B'}"><strong>${t.ok ? 'PASS' : 'FAIL'}</strong></td>
                        <td>${t.segundos}s</td>
                    `;
                    testsEl.appendChild(tr);
                });

            } catch(e) {
                document.getElementById('ledger-container').innerHTML = '<span style="color:#FF6B6B">Network Error fetching /api/auditoria_datos</span>';
            }
        }
        
        // Auto-fetch on load
        fetchData();
    </script>
</body>
</html>
